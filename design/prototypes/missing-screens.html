<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Globetrot — screen studies</title>
    <link rel="stylesheet" href="../../packages/tokens/dist/tokens.css" />
    <link rel="stylesheet" href="missing-screens.css" />
  </head>
  <body>
    <header class="controls">
      <strong>Globetrot · Design study</strong>
      <label
        >Screen
        <select id="screen"></select
      ></label>
      <label
        >Language
        <select id="locale">
          <option value="en">English</option>
          <option value="pt-BR">Português (Brasil)</option>
        </select></label
      >
      <label
        >Theme
        <select id="theme">
          <option value="day">Day</option>
          <option value="red-eye">Red-eye</option>
        </select></label
      >
      <label
        >Frame
        <select id="viewport">
          <option value="desktop">Desktop</option>
          <option value="phone">Phone</option>
        </select></label
      >
    </header>
    <p class="notice">
      Design study · illustrative data · controls in the frame are visual only / Estudo de design ·
      dados ilustrativos · os controles no quadro são apenas visuais.
    </p>
    <main id="stage"></main>
    <script src="missing-screens.js"></script>
  </body>
</html>
