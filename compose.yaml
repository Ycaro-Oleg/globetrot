# Local development services (issue #12). Not used in production.
#   pnpm services:up      start and wait until healthy
#   pnpm services:check   verify everything the apps need
#   pnpm services:down    stop (data is kept in named volumes)
#   pnpm services:reset   stop and delete all local data
# Ports and credentials come from .env (copy .env.example). See docs/engineering/local-development.md.
name: globetrot

services:
  postgres:
    image: postgis/postgis:17-3.7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-globetrot}
      POSTGRES_USER: ${POSTGRES_USER:-globetrot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globetrot}
    ports:
      - '${POSTGRES_PORT:-5455}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage (stand-in for Hetzner Object Storage).
  # SeaweedFS is used because the official MinIO images are no longer published on Docker Hub.
  storage:
    image: chrislusf/seaweedfs:4.51
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-globetrot-dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-globetrot-dev-secret}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"dev","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -ip=storage -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256 -volume.max=0 \
          -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '${S3_PORT:-8333}:8333'
    volumes:
      - storage-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8333/healthz',
        ]
      interval: 2s
      timeout: 3s
      retries: 60

  # One-shot: creates the media bucket once storage is healthy (idempotent).
  storage-init:
    image: chrislusf/seaweedfs:4.51
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-globetrot-media}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        echo "s3.bucket.create -name $${S3_BUCKET}" | weed shell -master=storage:9333 2>&1 | grep -v 'already exists' || true
        echo "s3.bucket.list" | weed shell -master=storage:9333 | grep -q "$${S3_BUCKET}"
    restart: 'no'

  # Catches every email sent in development. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  storage-data:
