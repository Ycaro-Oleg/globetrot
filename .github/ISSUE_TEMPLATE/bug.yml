name: Bug
description: Something behaves incorrectly
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser/device, viewport, theme, language, commit/branch.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Bug no longer reproduces
        - [ ] Regression test added
